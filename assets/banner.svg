<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tricolor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="scanner-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulsing-border {
        animation: pulseBorder 3s infinite alternate;
      }
      @keyframes pulseBorder {
        0% { stroke: #3b82f6; stroke-opacity: 0.4; }
        100% { stroke: #10b981; stroke-opacity: 0.9; }
      }
      .scan-line {
        animation: scanMove 4s ease-in-out infinite;
      }
      @keyframes scanMove {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      .node-pulse {
        animation: nodePulse 2s infinite ease-in-out;
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #3b82f6); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 8px #10b981); }
      }
      .dot-flow {
        stroke-dasharray: 6 6;
        animation: dash 1s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -12; }
      }
      .status-text {
        animation: colorCycle 6s infinite;
      }
      @keyframes colorCycle {
        0%, 30% { fill: #10b981; }
        35%, 65% { fill: #38bdf8; }
        70%, 100% { fill: #f59e0b; }
      }
    </style>
  </defs>

  <!-- Background Base Card -->
  <rect width="900" height="280" rx="16" fill="url(#grad-bg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="276" rx="14" fill="none" class="pulsing-border" stroke-width="1.5"/>

  <!-- Tricolor Accent Top Bar -->
  <rect x="16" y="16" width="120" height="4" rx="2" fill="url(#tricolor)" filter="url(#glow)"/>

  <!-- Title & Subtitle -->
  <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">
    🇮🇳 GST Auditor Agent
  </text>
  <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#94a3b8">
    Autonomous Indian GST, CA Audit &amp; Universal ERP Suite for Claude Code &amp; Antigravity
  </text>

  <!-- Flow Diagram Section -->
  <!-- Left Box: ERP / Accounting Sources -->
  <g transform="translate(30, 95)">
    <rect width="180" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">INPUT SOURCES</text>
    <rect x="16" y="38" width="148" height="22" rx="4" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="53" font-family="monospace" font-size="10" fill="#38bdf8">Tally Prime (XML/CSV)</text>
    <rect x="16" y="65" width="148" height="22" rx="4" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="80" font-family="monospace" font-size="10" fill="#38bdf8">Zoho Books &amp; Swipe</text>
    <rect x="16" y="92" width="148" height="22" rx="4" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="107" font-family="monospace" font-size="10" fill="#38bdf8">Busy / Vyapar / Marg</text>
    <rect x="16" y="119" width="148" height="22" rx="4" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="134" font-family="monospace" font-size="10" fill="#38bdf8">Universal CSV / Excel</text>
  </g>

  <!-- Connection Line 1 -->
  <line x1="210" y1="170" x2="310" y2="170" stroke="#38bdf8" stroke-width="2" class="dot-flow"/>
  <polygon points="310,166 318,170 310,174" fill="#38bdf8"/>

  <!-- Center Box: GST Statutory AI Engine -->
  <g transform="translate(320, 90)">
    <rect width="260" height="160" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8" filter="url(#glow)"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="800" fill="#60a5fa">⚡ STATUTORY ENGINE</text>
    <text x="20" y="48" font-family="monospace" font-size="10" fill="#a5f3fc">✓ Mod-36 Luhn GSTIN Checksum</text>
    <text x="20" y="66" font-family="monospace" font-size="10" fill="#a5f3fc">✓ Inter vs Intra Place of Supply</text>
    <text x="20" y="84" font-family="monospace" font-size="10" fill="#a5f3fc">✓ Rule 138 E-Way &amp; Rule 48(4) IRN</text>
    <text x="20" y="102" font-family="monospace" font-size="10" fill="#a5f3fc">✓ Sec 17(5) Blocked ITC Detection</text>
    <text x="20" y="120" font-family="monospace" font-size="10" fill="#a5f3fc">✓ Rule 88C / 88D DRC-01B/C Risk</text>
    <text x="20" y="138" font-family="monospace" font-size="10" fill="#a5f3fc">✓ Rule 42/43 &amp; RFD-01 Refund</text>

    <!-- Scanning Line Effect -->
    <rect x="2" y="2" width="256" height="6" fill="url(#scanner-glow)" class="scan-line" pointer-events="none"/>
  </g>

  <!-- Connection Line 2 -->
  <line x1="580" y1="170" x2="670" y2="170" stroke="#10b981" stroke-width="2" class="dot-flow"/>
  <polygon points="670,166 678,170 670,174" fill="#10b981"/>

  <!-- Right Box: Statutory Outputs -->
  <g transform="translate(680, 95)">
    <rect width="190" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="16" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="0.5">COMPLIANCE OUTPUT</text>
    <rect x="14" y="38" width="162" height="22" rx="4" fill="#0f172a" stroke="#059669"/>
    <text x="24" y="53" font-family="monospace" font-size="10" fill="#34d399">GSTR-1 Portal JSON</text>
    <rect x="14" y="65" width="162" height="22" rx="4" fill="#0f172a" stroke="#059669"/>
    <text x="24" y="80" font-family="monospace" font-size="10" fill="#34d399">GSTR-3B PMT-06 Set-off</text>
    <rect x="14" y="92" width="162" height="22" rx="4" fill="#0f172a" stroke="#059669"/>
    <text x="24" y="107" font-family="monospace" font-size="10" fill="#34d399">GSTR-9 / 9C Annual Audit</text>
    <rect x="14" y="119" width="162" height="22" rx="4" fill="#0f172a" stroke="#059669"/>
    <text x="24" y="134" font-family="monospace" font-size="10" fill="#34d399">Interactive HTML Dash</text>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(680, 30)">
    <rect width="190" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
    <circle cx="20" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="18" font-family="sans-serif" font-size="10.5" font-weight="700" class="status-text">
      35/35 AUDITS PASSING
    </text>
  </g>
</svg>
